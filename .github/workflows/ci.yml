name: CI/CD

on:
  push:
    branches: [master]
  pull_request:

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - run: nix develop --command cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - run: nix develop --command cargo clippy --all-targets

  test:
    name: E2E tests (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: Run hermetic e2e check
        run: nix build -L .#checks.x86_64-linux.e2e

  deploy:
    name: Deploy ARM binary
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [fmt, clippy, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: Build static aarch64 binary
        run: nix build -L .#arm
      - name: Stage binary for upload
        run: |
          mkdir -p deploy
          cp -L result/bin/bill-keeper-aarch64 deploy/bill-keeper
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bill-keeper-aarch64
          path: deploy/bill-keeper
      - name: Copy binary to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/bill-keeper"
          target: "/opt/bill-keeper_api"
          strip_components: 1
      - name: Restart service
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            sudo -n systemctl restart bill_keeper.service
