name: CI/CD

on:
  push:
    branches: [master]
  pull_request:

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy --all-targets

  test:
    name: E2E tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bill_keeper_testing
          POSTGRES_USER: bill_keeper_testing
          POSTGRES_PASSWORD: bill_keeper_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bill_keeper_testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: bill_keeper_testing
      POSTGRES_USER: bill_keeper_testing
      POSTGRES_PASSWORD: bill_keeper_testing
      TESTING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install native dependencies (from flake.nix)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev libsqlite3-dev \
            clang libclang-dev cmake poppler-utils
      - name: Set LIBCLANG_PATH (flake.nix shellHook)
        run: |
          LIBCLANG=$(find /usr/lib -name "libclang.so*" 2>/dev/null | head -n 1)
          echo "LIBCLANG_PATH=$(dirname "$LIBCLANG")" >> "$GITHUB_ENV"
      - run: cargo build
      - run: cargo test --test e2e

  deploy:
    name: Deploy to server
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [fmt, clippy, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install native dependencies (from flake.nix)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev libsqlite3-dev \
            clang libclang-dev cmake poppler-utils
      - name: Set LIBCLANG_PATH (flake.nix shellHook)
        run: |
          LIBCLANG=$(find /usr/lib -name "libclang.so*" 2>/dev/null | head -n 1)
          echo "LIBCLANG_PATH=$(dirname "$LIBCLANG")" >> "$GITHUB_ENV"
      - run: cargo build --release
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bills_to_db
          path: target/release/bills_to_db
      - name: Copy binary to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "target/release/bills_to_db"
          target: "/opt/bill-keeper_api"
      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            sudo -n systemctl restart bills_to_db
